version: 2
# Roadmap Phase 4b — scoped NARROWLY on purpose (single-operator noise budget).
# Automated PRs: GitHub Actions SHAs (paired with CI-10 pin policy), yt-dlp (fast-moving,
# security-relevant), critical dev/runtime deps we actually exercise in CI (pytest*, ruff,
# flask, pydantic), and instagrapi (hashtag Layer A — session-validation fixes land in the
# hash-locked requirements/, not just pyproject's >= floor). Everything else (requests,
# python-dotenv, transitive churn, etc.) stays manual — broad Dependabot volume isn't worth
# triage on a localhost tool.
# SECURITY.md / CODEOWNERS were deliberately NOT added (enterprise checkboxes for a localhost tool).
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/requirements"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "yt-dlp"
      - dependency-name: "pytest*"
      - dependency-name: "ruff"
      - dependency-name: "flask"
      - dependency-name: "pydantic"
      - dependency-name: "instagrapi"
    ignore:
      # instagrapi 3.x: curl default transport (unpinned curl_cffi fails the hashed install), login() with no password-endpoint fallback, 2.18 envelopes stay on requests (accounts split by age); CI fakes the client, so remove only in a planned migration proven by a live scrape-login.
      - dependency-name: "instagrapi"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
