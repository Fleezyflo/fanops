# .github/ci-control-registry.yml
# =====================================================================================================
# The intended CI inventory. `tools/ci` reconciles it against .github/workflows/ (DC-1/2/4/6/7, in the
# required unit lane via tests/test_ci_registry_validator.py) and against live GitHub settings — branch
# protection (DC-3), workflow enablement (DC-8), repository security settings (DC-9) — in the scheduled
# `reconcile` job. Shape is enforced by ci-control-registry.schema.json.
#
# Authority when planes disagree: executable source & tests > live GitHub config > this file.
# docs/ENFORCEMENT.md indexes what actually enforces.
#
# ONE ROW PER JOB — DC-2 enforces the bijection in both directions, so adding a workflow job without a
# row here reddens the required lane. `id` is STABLE: a job's display name may change, the id never
# does, and DC-1 catches a required context whose job was renamed out from under it.
# =====================================================================================================
version: 1
status: accepted

# The required set. DC-3 requires LIVE branch protection to equal this exactly, and change them in the
# same PR. This does NOT assert GitHub admin enforcement — `enforce_admins` is false, and changing it
# is a separate operator-approved settings change.
required_contexts:
  - "unit (fast, no toolchain)"

# Repository security settings that must be ON in live GitHub (DC-9). Keys are exactly those of the
# repo object's `security_and_analysis`. Nothing in this tree can prove any of them: they are GitHub
# settings, so an operator switching one off is invisible to every static check — which is the whole
# reason this list exists. Deliberately a SUBSET: `secret_scanning_non_provider_patterns` and
# `secret_scanning_validity_checks` are off and stay undeclared rather than declared-and-violated.
required_security_settings:
  - dependabot_security_updates
  - secret_scanning
  - secret_scanning_push_protection

# ---------------------------------------------------------------------------------------------------
# One row per workflow job. DC-2 enforces the bijection in both directions: a control naming a job that
# does not exist is a phantom, and a job no control names is unregistered. So this list is exhaustive
# by construction — adding a job without adding a row here reddens the required unit lane.
# ---------------------------------------------------------------------------------------------------
controls:

  # ===== ci.yml =====================================================================================
  - id: CI-UNIT
    classification: required
    workflow: .github/workflows/ci.yml
    job: unit
    branch_protection_context: "unit (fast, no toolchain)"

  - id: CI-BASEINSTALL
    classification: advisory
    workflow: .github/workflows/ci.yml
    job: base-install
    branch_protection_context: "base install (no extras) refuses smart-framing"

  - id: CI-E2E
    classification: scheduled
    workflow: .github/workflows/ci.yml
    job: e2e
    branch_protection_context: "real-tooling E2E (must run, not skip)"

  - id: CI-TIMING
    classification: advisory
    workflow: .github/workflows/ci.yml
    job: ci-timing

  # ===== architecture.yml ===========================================================================
  - id: ARCH-IMPACT
    classification: advisory
    workflow: .github/workflows/architecture.yml
    job: impact

  - id: ARCH-CONTROLS
    classification: advisory
    workflow: .github/workflows/architecture.yml
    job: controls

  - id: ARCH-RECONCILE
    classification: scheduled
    workflow: .github/workflows/architecture.yml
    job: reconcile

  # ===== lane-guard.yml =============================================================================
  - id: LANE-GUARD
    classification: advisory
    workflow: .github/workflows/lane-guard.yml
    job: lane-guard
    branch_protection_context: "lane file-ownership + cross-PR collision"

  # ===== nightly.yml ================================================================================
  - id: NIGHTLY-PIPAUDIT
    classification: scheduled
    workflow: .github/workflows/nightly.yml
    job: dependency-audit

  - id: NIGHTLY-ASR
    classification: scheduled
    workflow: .github/workflows/nightly.yml
    job: asr-smoke
