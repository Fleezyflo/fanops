[project]
name = "fanops"
version = "0.4.0"
description = "MOH FLOW FAN OPS — intelligent clip + cross-post engine"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.7", "pydantic-settings>=2.0", "requests>=2.31", "python-dotenv>=1.0", "yt-dlp>=2024.0"]

[project.optional-dependencies]
# PyYAML is DIRECT, not transitive. `tools/ci` and `tools/contract` parse the control registry and
# workflow files with it; it previously arrived only as a third-order dependency of vcrpy, so the
# governance tooling was one unrelated dev-dependency bump away from being unable to read its own
# authority. A dependency load-bearing for a verdict must be declared where it is used.
# jsonschema is DIRECT and LOAD-BEARING, for the same reason PyYAML is: `tools/ci` validates the control
# registry against .github/ci-control-registry.schema.json and imports it at MODULE SCOPE, so removing it
# here does not weaken a check — it breaks the unit lane. A dependency load-bearing for a verdict must be
# declared where it is used.
dev = ["pytest>=8.0", "pytest-mock>=3.12", "pytest-timeout>=2.3", "pytest-cov>=5.0", "pytest-xdist>=3.5", "ruff>=0.5", "pytest-recording>=0.13", "vcrpy>=6.0", "PyYAML>=6.0", "jsonschema>=4.0"]
# Local transcription. Installed into the venv in Task 2. (whisper CLI lands on PATH.)
transcribe = ["openai-whisper>=20231117"]
# Local web cockpit (spec §10). Flask is OPTIONAL: `pip install -e .` (core CLI) stays Flask-free;
# only `pip install -e '.[studio]'` pulls it. The CLI imports it LAZILY so a no-[studio] install runs.
studio = ["flask>=3.0"]
# Produced-clip compositing (operator-chosen 2026-06-14): multi-layer template cards, dynamic text
# titles, and crossfade transitions via MoviePy. OPTIONAL + lazy-imported like [studio]/[transcribe]
# — `pip install -e .` stays MoviePy-free; only `.[compose]` pulls it (drags numpy/Pillow/imageio).
# fanops.compose imports it lazily and FAILS OPEN (copies the base clip) when absent, so a
# no-[compose] install never breaks the render path. MoviePy 2.x API only (no moviepy.editor).
#
# WHY AN IMMUTABLE COMMIT ARCHIVE INSTEAD OF `moviepy>=2.0` (MOL-723, 2026-08-01):
# MoviePy's newest RELEASE is still 2.2.1 (2025-05-21) and it declares `pillow<12.0`. That cap was
# the SOLE reason requirements/ci-e2e.txt resolved Pillow 11.3.0, which carries 18 known advisories
# — the e2e lock's entire Pillow advisory surface. Upstream removed the cap in commit 97316f37
# ("Add a custom dropped-in replacement for pillow internal _multiline_spacing", 2025-06-19), which
# reimplements the one Pillow internal (`ImageDraw._multiline_spacing`) MoviePy relied on, but has
# never been released. So we pin THAT COMMIT'S IMMUTABLE SOURCE ARCHIVE — a URL + sha256, not a
# branch/tag and not `git+`, because `pip install --require-hashes` (how CI installs both locks)
# CANNOT hash a VCS ref and refuses the install outright. The archive's version metadata is still
# "2.2.1"; only the Pillow cap and the `_multiline_spacing` shim differ from the release.
# The `#sha256=` FRAGMENT IS LOAD-BEARING, not decoration. Without it pip-compile resolves this to the
# name+version it finds inside the archive ("moviepy 2.2.1"), matches that against PyPI, and emits the
# hashes of the RELEASED 2.2.1 sdist+wheel — hashes the GitHub tarball can never satisfy, so the lock
# stops being --require-hashes installable (proved: "Expected 6b56803f… Got 6bef8575…"). With the
# fragment, pip-tools takes its `is_url_requirement` branch and hashes the actual artifact.
# tests/test_moviepy_pillow12_pin.py pins that: the lock's moviepy hash must equal this fragment.
# EXIT CONDITION — revert to a plain released pin the moment MoviePy publishes any release > 2.2.1
# containing 97316f37 (check `pillow` in its requires_dist: the cap must be gone). Then this becomes
# `compose = ["moviepy>=<that version>"]` and ./scripts/lock-deps.sh is re-run. Nothing else here
# depends on the URL form.
compose = ["moviepy @ https://github.com/Zulko/moviepy/archive/97316f37f6a8d3843abfb53eba8f3bb0ea46a008.tar.gz#sha256=6bef8575b091f6a7342ed271ff5dba97dbb07255df0a5b81fec38f8248b143d9"]
# Accurate music transcription (the two biggest ASR-accuracy levers for rap/song): Demucs strips the
# beat so Whisper reads the lyrics, not the instrumental; faster-whisper runs large-v3 (the proven
# accuracy winner over turbo) at int8 so it's practical on CPU. OPTIONAL + lazy + FAIL-OPEN like the
# others — `pip install -e .` stays free of both; only `.[asr]` pulls them (drags torch). Without the
# extra, isolate_vocals returns RAW audio and transcribe falls back to the legacy `whisper` CLI, so a
# no-[asr] install transcribes exactly as before. certifi ships the CA bundle (macOS model-download fix).
asr = ["demucs>=4.0", "faster-whisper>=1.0", "certifi"]
# Subject-aware reframe (smart framing): OpenCV detects the dominant face per cut window so the 9:16 crop
# follows the subject instead of the blind top/center guess. OPTIONAL + lazy + FAIL-OPEN like the others —
# `pip install -e .` stays OpenCV-free; only `.[framing]` pulls it (numpy already comes via [compose]).
# fanops.framing imports cv2 lazily; with smart_framing OFF a no-[framing] install crops centered exactly as
# before, but with smart_framing ON (the default) the render REFUSES (ToolchainMissingError -> exit 2) rather
# than silently centre-crop — install the extra, or set FANOPS_SMART_FRAMING=0 to centre-crop. headless wheel
# = no GUI/Qt deps (it only reads frames + detects boxes).
framing = ["opencv-python-headless>=4.9"]
# OS keychain reads for operator secrets (MOL-359). OPTIONAL + lazy + FAIL-OPEN — `pip install -e .` stays
# keyring-free; only `.[keyring]` pulls it. fanops.secret_provider imports keyring lazily and degrades to
# Settings/.env when absent or when no backend is available (headless CI/Linux).
keyring = ["keyring>=25.0"]
# Hashtag Layer A network (instagrapi). OPTIONAL + lazy — without the extra, `fanops hashtags refresh`
# aborts loudly (written:False / no_scrape); there is no silent Graph fallback.
igscrape = ["instagrapi>=2.18.12"]

[project.scripts]
fanops = "fanops.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Vendored YuNet face-detection model for smart framing ([framing] extra). Shipped in-package so
# detection is offline + deterministic (no first-use download). ~232KB.
fanops = ["data/*.onnx", "data/baked_personas.json"]

[tool.ruff]
# Lint is wired for ENFORCEMENT GOING FORWARD (catch unused/undefined names, syntax errors),
# not to mass-reformat the existing tree (audit (i)). Conservative select: pyflakes (F — the
# real-bug class: unused imports, undefined names) + pycodestyle errors (E — incl. E9 syntax).
line-length = 120
[tool.ruff.lint]
select = ["E", "F"]
# These four E-rules flag a DELIBERATE house style, not defects, so silencing them keeps the
# check green without a sweeping diff (the rest of E + all of F stay enforced):
#   E701/E702 — compact one-liners (`if x: y`, `a; b`) used throughout for terse guards/imports.
#   E401      — grouped imports (`import re, subprocess`) — same compact convention.
#   E501      — a few dense AUDIT-provenance comment lines run long on purpose; wrapping them
#               would fragment load-bearing rationale. line-length=120 still documents intent.
ignore = ["E701", "E702", "E401", "E501"]
[tool.ruff.lint.per-file-ignores]
# E402 in tests is the REQUIRED import-after-code pattern: pytest.importorskip("flask") /
# env seeding must run BEFORE importing the module under test. Not a defect; src/ stays enforced.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: hits real ffmpeg/whisper/Blotato sandbox (deselect with -m 'not integration')",
  "slow: cross-face proofs; deselect with -m 'not integration and not slow'",
  "ci_hook_regression: proves FANOPS_REQUIRE_E2E skip→fail hook; excluded from integration CI run",
  "asr: needs the heavy [asr] extra (demucs/faster-whisper/torch); nightly-only, excluded from PR CI (MOL-197)",
  "macos_only: needs launchd; CANNOT pass on the ubuntu e2e runner, so it is deselected there (MOL-830)",
]
# Global per-test timeout (pytest-timeout): a concurrency regression that self-deadlocks under the
# ledger SQLite busy_timeout (e.g. a nested write txn inside a transaction) FAILS FAST here instead
# of hanging CI for the 30s busy_timeout × N. The lock/deadlock tests rely on this (Phase B guardrail).
# 60s is well above any real test (the slowest, the real-tooling E2E, runs in ~10-20s).
timeout = 60
